<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WordHarvest</title>
  <link rel="stylesheet" href="styles.css">
  <script src="popup.js" defer></script>
</head>
<body class="popup">
  <header class="brand"><img src="icons/icon-32.png" width="20" height="20" alt=""> WordHarvest</header>
  <div class="stats">
    <div class="stat"><span id="total" class="num">–</span><span class="label">saved words</span></div>
    <div class="stat due"><span id="due" class="num">–</span><span class="label">due today</span></div>
  </div>
  <button id="start" class="btn primary block">Start review</button>
  <nav class="links">
    <a href="review.html#browse" data-open>Browse cards</a>
    <a href="review.html#data" data-open>Import / export</a>
    <a href="options.html" data-open>Settings</a>
  </nav>
  <p class="hint">Double-click any word on a web page to translate and save it.</p>
</body>
</html>
